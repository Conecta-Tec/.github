<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Conecta Tecnologia</title>
  <desc id="desc">Tecnologia para o humano. Conecta, PlenaMente, Plataforma e Operações.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050715"/>
      <stop offset="0.55" stop-color="#090B2B"/>
      <stop offset="1" stop-color="#15104A"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1BC1FF"/>
      <stop offset="0.46" stop-color="#7857FF"/>
      <stop offset="1" stop-color="#F72C8A"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7E57"/>
      <stop offset="1" stop-color="#F72C8A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.055"/>
    </pattern>
    <clipPath id="frame"><rect width="1600" height="640" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="640" fill="url(#bg)"/>
    <rect width="1600" height="640" fill="url(#grid)"/>

    <circle cx="1360" cy="208" r="246" fill="none" stroke="#7857FF" stroke-opacity="0.28" stroke-width="1"/>
    <circle cx="1360" cy="208" r="176" fill="none" stroke="#1BC1FF" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="7 13"/>
    <circle cx="1360" cy="208" r="104" fill="none" stroke="#F72C8A" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="1360" cy="208" r="38" fill="url(#signal)"/>
    <circle cx="1360" cy="208" r="74" fill="#7857FF" opacity="0.2" filter="url(#glow)"/>

    <path d="M760 544 C934 418 1025 96 1360 208 C1464 243 1538 344 1668 277" fill="none" stroke="url(#signal)" stroke-width="5"/>
    <path d="M725 570 C922 496 1056 214 1360 208 C1485 206 1568 268 1662 236" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

    <g fill="#FFFFFF">
      <circle cx="824" cy="487" r="5"/>
      <circle cx="1003" cy="312" r="5"/>
      <circle cx="1148" cy="228" r="5"/>
      <circle cx="1518" cy="302" r="5"/>
    </g>
    <g fill="url(#warm)">
      <rect x="1160" y="451" width="24" height="24" rx="5" transform="rotate(22 1172 463)"/>
      <rect x="1492" y="474" width="14" height="14" rx="3" transform="rotate(22 1499 481)"/>
    </g>

    <g font-family="Inter, Arial, sans-serif" fill="#FFFFFF">
      <text x="80" y="88" font-size="18" font-weight="700" letter-spacing="4">CONECTA / TECNOLOGIA</text>
      <text x="80" y="182" font-size="84" font-weight="800" letter-spacing="-4">TECNOLOGIA</text>
      <text x="80" y="270" font-size="84" font-weight="800" letter-spacing="-4">PARA O</text>
      <text x="80" y="358" font-size="84" font-weight="800" letter-spacing="-4" fill="url(#signal)">HUMANO.</text>
      <text x="84" y="418" font-size="21" font-weight="400" fill="#C7CAE5">Produtos, plataformas e inteligência para ampliar o potencial humano.</text>
      <text x="84" y="548" font-size="15" font-weight="700" letter-spacing="2" fill="#AEB4D8">CONECTA</text>
      <text x="208" y="548" font-size="15" font-weight="700" letter-spacing="2" fill="#AEB4D8">PLENAMENTE</text>
      <text x="374" y="548" font-size="15" font-weight="700" letter-spacing="2" fill="#AEB4D8">PLATAFORMA</text>
      <text x="546" y="548" font-size="15" font-weight="700" letter-spacing="2" fill="#AEB4D8">OPERAÇÕES</text>
      <text x="80" y="600" font-size="13" font-weight="500" letter-spacing="3" fill="#777FAE">BUILD  /  CONNECT  /  LEARN  /  EVOLVE</text>
    </g>

    <rect x="80" y="496" width="612" height="1" fill="#FFFFFF" opacity="0.16"/>
    <rect x="80" y="122" width="72" height="5" rx="2.5" fill="url(#warm)"/>
  </g>
</svg>
