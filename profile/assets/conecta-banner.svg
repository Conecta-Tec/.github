<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Conecta Tecnologia</title>
  <desc id="desc">Banner colorido da organização de tecnologia da Conecta</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0015A8"/>
      <stop offset="0.52" stop-color="#4E36A3"/>
      <stop offset="1" stop-color="#F72C8A"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#1BC1FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00115F" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="32" fill="url(#bg)"/>
  <circle cx="1080" cy="44" r="168" fill="#FF7E57" opacity=".92"/>
  <circle cx="1140" cy="286" r="116" fill="#5EEAD4" opacity=".9"/>
  <circle cx="925" cy="315" r="72" fill="#1BC1FF" opacity=".52"/>
