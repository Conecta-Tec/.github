    <path d="M92 104c0-13 10-23 23-23 8 0 15 4 19 10l-12 8a10 10 0 0 0-8-4 10 10 0 1 0 8 16l12 8c-4 7-11 11-20 11-12 0-22-8-22-19z" fill="#02139D"/>
    <circle cx="126" cy="88" r="7" fill="#FF7E57"/>
